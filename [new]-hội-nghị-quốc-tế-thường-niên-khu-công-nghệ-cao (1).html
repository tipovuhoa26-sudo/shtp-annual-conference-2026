ÊN CỨU VÀ ĐỔI MỚI SÁNG TẠO VÙNG ĐÔNG NAM BỘ","combine":"KẾT HỢP","title2":"HỘI NGHỊ QUỐC TẾ THƯỜNG NIÊN","edition":"KHU CÔNG NGHỆ CAO LẦN THỨ 8 NĂM 2026","subtitle":"“Đô thị Công nghệ cao – Động lực tăng trưởng của Thành phố Hồ Chí Minh trong kỷ nguyên mới”","btnRegister":"ĐĂNG KÝ THAM GIA","btnContent":"NỘI DUNG SỰ KIỆN"},"intro":{"title":"GIỚI THIỆU CHUNG VỀ SỰ KIỆN","subtitle":"Kết nối tri thức – Thúc đẩy công nghệ – Kiến tạo tương lai đô thị","desc1":"Sự kiện nhằm thúc đẩy nghiên cứu khoa học và đổi mới sáng tạo tại khu vực Đông Nam Bộ.","p1":"Vào ngày 16 tháng 10 năm 2026, sự kiện Ngày Nghiên cứu và Đổi mới sáng tạo Vùng Đông Nam Bộ kết hợp Hội nghị Quốc tế thường niên Khu Công nghệ cao lần thứ 8 sẽ chính thức diễn ra tại Trường đại học FPT (Khu Công nghệ cao TP. Hồ Chí Minh). Sự kiện do Ban Quản lý Khu Công nghệ cao chủ trì tổ chức, dưới sự chỉ đạo của UBND TP. Hồ Chí Minh, quy tụ từ 500 đến 1.000 đại biểu là lãnh đạo, chuyên gia, nhà khoa học, doanh nghiệp, nhà đầu tư trong và ngoài nước cùng với sự tham gia của sinh viên các trường đại học trong khu vực.","p2":"Với chủ đề “Đô thị Công nghệ cao – Động lực tăng trưởng của Thành phố Hồ Chí Minh trong kỷ nguyên mới”, sự kiện hướng tới thúc đẩy liên kết vùng Đông Nam Bộ, phát triển hệ sinh thái đổi mới sáng tạo và khai thác vai trò của khoa học – công nghệ trong tăng trưởng kinh tế bền vững.","p3":"Chương trình chính của sự kiện là Hội nghị quốc tế thường niên, bao gồm phiên toàn thể với các tham luận chiến lược từ các nhà lãnh đạo, chuyên gia quốc tế, cùng 4 phiên chuyên đề tập trung vào các trụ cột quan trọng:","pillars":["Công nghệ chiến lược trong phát triển công nghiệp đô thị","Hệ sinh thái đổi mới sáng tạo","Hạ tầng công nghệ và đô thị thông minh","Phát triển nguồn nhân lực và hợp tác quốc tế"],"p4":"Bên cạnh đó, sự kiện còn bao gồm chuỗi hoạt động phong phú như: Triển lãm công nghệ, Startup Pitchfest 2026, Cuộc thi thiết kế vi mạch cho đô thị thông minh, Cuộc thi ý tưởng đổi mới sáng tạo sinh viên Vùng Đông Nam Bộ và các hội thảo chuyên đề sẽ tạo nên một không gian kết nối đa chiều giữa nghiên cứu – doanh nghiệp – đầu tư.","p5":"Sự kiện không chỉ là diễn đàn học thuật uy tín mà còn là nền tảng thúc đẩy hợp tác, chuyển giao công nghệ và hình thành các sáng kiến chiến lược, góp phần định hình tương lai đô thị công nghệ cao tại Việt Nam và khu vực."},"partners":{"title":"ĐƠN VỊ TỔ CHỨC","steering":"ĐƠN VỊ CHỈ ĐẠO","organizer":"ĐƠN VỊ TỔ CHỨC","coorganizer":"ĐƠN VỊ PHỐI HỢP","ubnd":"ỦY BAN NHÂN DÂN THÀNH PHỐ HỒ CHÍ MINH","shtp":"BAN QUẢN LÝ KHU CÔNG NGHỆ CAO TP. HCM"},"content":{"title":"NỘI DUNG SỰ KIỆN","time":"THỜI GIAN","location":"ĐỊA ĐIỂM","date":"Ngày 16","monthYear":"Tháng 10 - Năm 2026","uni":"Trung tâm đào tạo và nghiên cứu công nghệ\nTrường đại học FPT","address1":"Lô E2a-7, Đường D1, Khu Công nghệ cao","address2":"Phường Tăng Nhơn Phú, Thành phố Hồ Chí Minh","items":[{"title":"Hội nghị quốc tế thường niên","desc":"Diễn đàn trao đổi học thuật và công nghệ quy mô quốc tế với các chuyên gia đầu ngành."},{"title":"Cuộc thi thiết kế vi mạch cho đô thị thông minh","desc":"Sân chơi chuyên môn thúc đẩy nghiên cứu và phát triển ngành bán dẫn tại Việt Nam."},{"title":"Cuộc thi Ý tưởng đổi mới sáng tạo","desc":"Khuyến khích các ý tưởng đột phá giải quyết các bài toán thực tiễn của đô thị hiện đại."},{"title":"Triển lãm công nghệ","desc":"Không gian trình diễn các giải pháp công nghệ tiên tiến, Robotics và AI ứng dụng."},{"title":"Startup Pitchfest 2026","desc":"Cơ hội kết nối các startup tiềm năng với các quỹ đầu tư và hệ sinh thái đổi mới sáng tạo."},{"title":"Các hội thảo chuyên đề","desc":"Chuỗi thảo luận chuyên sâu về các xu hướng công nghệ mới nhất trong kỷ nguyên số."}]},"agenda":{"title":"CHƯƠNG TRÌNH CHI TIẾT","time":"Thời gian","content":"Nội dung","details":"Hoạt động chi tiết","morningTitle":"PHIÊN BUỔI SÁNG: KHAI MẠC & PHIÊN TOÀN THỂ","afternoonTitle":"PHIÊN BUỔI CHIỀU: CÁC PHIÊN CHUYÊN ĐỀ SONG SONG (13:00 – 16:00)","afternoonSubtitle":"Các phiên chuyên đề v // HELPER SVG AVATAR GENERATOR FOR SPEAKERS
// ==========================================
function getSpeakerAvatarSvg(name) {
  const clean = (name || '').replace(/^(GS\.|TS\.|PGS\.|PROF\.|DR\.|ASSOC\.|MR\.|ÔNG|BÀ|LÃNH ĐẠO)\s*/gi, '').trim();
  const words = clean.split(/\s+/).filter(Boolean);
  let initials = 'SP';
  if (words.length >= 2) {
    initials = (words[0][0] + words[words.length - 1][0]).toUpperCase();
  } else if (words.length === 1) {
    initials = words[0].slice(0, 2).toUpperCase();
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">' +
    '<defs><linearGradient id="g_' + initials + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
    '<stop offset="0%" stop-color="#001f3f"/><stop offset="100%" stop-color="#0054a5"/>' +
    '</linearGradient></defs>' +
    '<rect width="200" height="200" fill="url(#g_' + initials + ')"/>' +
    '<circle cx="100" cy="72" r="36" fill="#ffcc00" opacity="0.95"/>' +
    '<path d="M42 175 C42 130 68 120 100 120 C132 120 158 130 158 175 Z" fill="#ffffff" opacity="0.85"/>' +
    '<text x="100" y="80" text-anchor="middle" fill="#001f3f" font-family="system-ui, sans-serif" font-weight="800" font-size="20">' + initials + '</text>' +
    '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

                                stroke: "currentColor",
                                viewBox: "0 0 24 24",
                                children: b.jsx("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M19 9l-7 7-7-7" })
                              })
                            })
                          ]
                        }),
                        b.jsx("h4", {
                          className: "font-headline font-extrabold text-base md:text-lg text-shtp-dark leading-snug mb-3 hover:text-shtp-blue transition-colors",
                          children: session.title
                        }),
                        !isOpen && b.jsxs("div", {
                          className: "flex flex-wrap items-center gap-1.5 mt-2",
                          children: [
                            b.jsx("span", { className: "text-[11px] font-bold text-slate-400 uppercase tracking-wide", children: s.agenda.speakerTag + ":" }),
                            session.speakers.map((sp, spIdx) => b.jsx("span", {
                              className: "bg-slate-100 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded-md",
                              children: sp.name
                            }, spIdx))
                          ]
                        })
                      ]
                    }),

                    // Expandable Details Area
                    isOpen && b.jsxs(Ht.div, {
                      initial: { opacity: 0, height: 0 },
                      animate: { opacity: 1, height: "auto" },
                      exit: { opacity: 0, height: 0 },
                      className: "px-6 pb-6 pt-2 border-t border-slate-100 bg-slate-50/50 space-y-4",
                      children: [
                        b.jsxs("div", {
                          children: [
                            b.jsx("h5", {
                              className: "text-xs font-extrabold text-shtp-blue uppercase tracking-wider mb-2",
                              children: s.agenda.speakerTag
                            }),
                            b.jsx("div", {
                              className: "space-y-2",
                              children: session.speakers.map((sp, spIdx) => b.jsxs("div", {
                                className: "bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex items-start gap-3",
                                children: [
                                  b.jsx("div", {
                                    className: "w-8 h-8 rounded-full bg-shtp-blue/10 text-shtp-blue flex items-center justify-center shrink-0 font-bold text-xs",
                                    children: sp.name.charAt(0)
                                  }),
                                  b.jsxs("div", {
                                    children: [
                                      b.jsx("div", { className: "font-bold text-shtp-dark text-xs md:text-sm", children: sp.name }),
                                      b.jsx("div", { className: "text-[11px] md:text-xs text-slate-500 font-medium leading-relaxed", children: sp.role })
                                    ]
                                  })
                                ]
                              }, spIdx))
                            })
                          ]
                        }),
                        b.jsxs("div", {
                          children: [
                            b.jsx("h5", {
                              className: "text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-1.5",
                              children: i === "vi" ? "Nội dung & Định hướng thảo luận" : "Session Focus & Discussion"
                            }),
                            b.jsx("p", {
                              className: "text-xs md:text-sm text-slate-600 leading-relaxed font-normal bg-white p-3.5 rounded-xl border border-slate-100",
                              children: session.description
                            })
                          ]
                        })
                      ]
                    }),

                    // Card Footer Action Button
                    b.jsx("div", {
                      className: "p-4 bg-slate-50/80 border-t border-slate-100 flex items-center justify-between",
                      children: b.jsxs("button", {
                        onClick: () => toggleSession(session.id),
                        className: "text-xs font-bold text-shtp-blue hover:text-shtp-navy flex items-center gap-1.5 transition-colors cursor-pointer",
                        children: [
                          b.jsx("span", { children: isOpen ? s.agenda.collapseBtn : s.agenda.expandBtn }),
                          b.jsx("svg", {
                            className: "w-3.5 h-3.5 transition-transform duration-300 " + (isOpen ? "rotate-180" : ""),
                            fill: "none",
                            stroke: "currentColor",
                            viewBox: "0 0 24 24",
                            children: b.jsx("path", { strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: "2", d: "M19 9l-7 7-7-7" })
                          })
                        ]
                      })
                    })
                  ]
                }, session.id);
              })
            })
          ]
        })
      ]
    })
  });
}
